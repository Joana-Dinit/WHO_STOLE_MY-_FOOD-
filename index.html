<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Who Ate My Food?</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <div class="container">

        <h1>🍕 WHO ATE MY FOOD?</h1>

        <p class="subtitle">
            The world's most useless food investigation system 🔎
        </p>

        <div class="card">

            <h2>🚨 Start an Investigation</h2>

            <label>Who lives at home?</label>

            <input
                type="text"
                id="people"
                placeholder="Brother, Sister, Mother..."
            >

            <label>📸 Upload BEFORE photo</label>

            <input
                type="file"
                id="beforePhoto"
                accept="image/*"
            >

            <label>📸 Upload AFTER photo</label>

            <input
                type="file"
                id="afterPhoto"
                accept="image/*"
            >

            <button id="investigateButton">
                🔎 INVESTIGATE
            </button>

        </div>

        <div class="result-card" id="result">

            <h2>🕵️ Investigation Result</h2>

            <p id="verdict">
                Upload the food photos and start the investigation...
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
